name: publish-mcp-registry

# Publishes ./server.json to the official MCP Registry using GitHub Actions OIDC, which
# grants io.github.zumerlab/* to workflows of this repository. (An interactive
# `mcp-publisher login github` only sees the organization when GitHub reports the
# membership to the registry's GitHub App, which is not guaranteed.)
#
# Run it AFTER the npm version named in server.json is published: the registry verifies
# that the npm package carries the matching mcpName before accepting the listing.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check that the npm package named in server.json is published
        run: |
          VERSION=$(jq -r .version server.json)
          PACKAGE=$(jq -r '.packages[0].identifier' server.json)
          npm view "${PACKAGE}@${VERSION}" version
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate with GitHub Actions OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
      - name: Verify the listing
        run: curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.zumerlab/snapsurf"
